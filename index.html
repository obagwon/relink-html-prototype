<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RE:LINK — HTML Gameplay Prototype</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas" aria-label="RE:LINK 3D gameplay prototype"></canvas>

  <section id="start-screen" class="screen visible">
    <div class="start-card">
      <div class="eyebrow">HTML GAMEPLAY PROTOTYPE</div>
      <h1>RE<span>:</span>LINK</h1>
      <p>끊어진 세계의 세 힘을 연결해<br />멈춰 버린 길을 되살리세요.</p>
      <button id="start-button" type="button">START PROTOTYPE</button>
      <small>헤드폰 권장 · 클릭하면 마우스가 화면에 고정됩니다</small>
    </div>
  </section>

  <div id="hud" class="hidden">
    <header class="topbar">
      <div>
        <div id="region-name" class="region-name">CENTRAL HUB</div>
        <div id="objective" class="objective">세계의 핵을 살펴보고 지역으로 향하세요.</div>
      </div>
      <div id="fragment-status" class="fragments" aria-label="복원한 조각">
        <span data-fragment="bloom"></span><span data-fragment="freeze"></span><span data-fragment="pulse"></span>
      </div>
    </header>

    <div id="crosshair" class="crosshair"><i></i><b></b></div>
    <div id="target-card" class="target-card hidden">
      <strong id="target-name"></strong>
      <span id="target-hint"></span>
    </div>
    <div id="interaction-prompt" class="interaction-prompt hidden">E · 상호작용</div>

    <div id="ability-bar" class="ability-bar">
      <button class="ability bloom selected" data-ability="bloom"><kbd>1</kbd><i></i><span>RE:BLOOM</span></button>
      <button class="ability freeze" data-ability="freeze"><kbd>2</kbd><i></i><span>RE:FREEZE</span></button>
      <button class="ability pulse" data-ability="pulse"><kbd>3</kbd><i></i><span>RE:PULSE</span></button>
    </div>

    <aside id="controls-tip" class="controls-tip">
      <b>WASD</b> 이동 <b>SPACE</b> 점프 <b>SHIFT</b> 달리기<br />
      <b>1 / 2 / 3</b> 능력 <b>LMB</b> 사용 <b>E</b> 상호작용
    </aside>

    <div id="toast" class="toast"></div>
    <aside id="debug-panel" class="debug-panel hidden"></aside>
  </div>

  <section id="pause-screen" class="screen pause-screen">
    <div class="pause-card">
      <div class="eyebrow">PROTOTYPE PAUSED</div>
      <h2>RE:LINK</h2>
      <button id="resume-button" type="button">계속하기</button>
      <button id="reset-region-button" class="secondary" type="button">현재 지역 리셋</button>
      <button id="reset-progress-button" class="danger" type="button">저장 진행도 초기화</button>
      <small>F1 디버그 · F2 허브 · F3 생명 · F4 정지 · F5 기계</small>
    </div>
  </section>

  <noscript>이 프로토타입은 JavaScript가 필요합니다.</noscript>
  <output id="runtime-status" hidden>booting</output>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
